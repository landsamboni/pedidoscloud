name: CI

# Lightweight app CI for the monorepo (apps/web). No infrastructure / Terraform
# pipeline here — infra is applied manually (see DEPLOYMENT.md).

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  web-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type-check
        run: npx tsc --noEmit
