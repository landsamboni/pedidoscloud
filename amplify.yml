# AWS Amplify Hosting build settings (monorepo).
#
# AMPLIFY_MONOREPO_APP_ROOT=apps/web is set at the APP level (via Terraform).
# Amplify reads it before branch vars load to locate package.json. All runtime
# vars (DATABASE_URL, S3, auth) are at the BRANCH level.
#
# MIGRATIONS: prisma migrate deploy is NOT run here. With VPC connectivity
# enabled, the RDS security group restricts access to the Amplify Lambda SG
# + laptop CIDRs only — CodeBuild runs outside the VPC and cannot reach RDS.
# Run migrations manually from your laptop before deploying a new schema:
#   cd apps/web && export DATABASE_URL=$(terraform output -raw database_url) && npm run db:deploy
# See DEPLOYMENT.md §4.
#
# npm run build = prisma generate && next build (see package.json).
# The node -e step bakes runtime vars into .next/.env.runtime (deployed with
# the artifact) so lib/runtime-env.ts can load them in the SSR Lambda.
version: 1
applications:
  - appRoot: apps/web
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            - npm run build
            - |
              node -e "
              const fs = require('fs');
              const vars = [
                'AUTH_SECRET','DATABASE_URL','STORAGE_DRIVER',
                'S3_REGION','S3_BUCKET','S3_ACCESS_KEY_ID','S3_SECRET_ACCESS_KEY',
                'ADMIN_USER','ADMIN_PASSWORD'
              ];
              const lines = vars.filter(k => process.env[k]).map(k => k + '=' + process.env[k]);
              fs.writeFileSync('.next/.env.runtime', lines.join('\n'));
              console.log('Runtime env written for:', vars.filter(k => process.env[k]).join(', '));
              "
      artifacts:
        baseDirectory: .next
        files:
          - "**/*"
      # Cache paths are relative to the repo root (not appRoot), so they must be
      # prefixed with apps/web. .next/cache is the high-value one (incremental
      # next build). This uses the cache-artifact store, which works even when
      # Amplify's automatic environment cache fails to write.
      cache:
        paths:
          - apps/web/node_modules/**/*
          - apps/web/.next/cache/**/*
