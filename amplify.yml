# AWS Amplify Hosting build settings (monorepo).
# The Next.js app lives in apps/web. Set the Amplify app's "monorepo app root"
# to apps/web in the console, or rely on the appRoot below.
#
# Migrations are NOT run here on purpose — run `npm run db:deploy` against RDS
# manually (see DEPLOYMENT.md). Build only generates the Prisma client + builds.
version: 1
applications:
  - appRoot: apps/web
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            # package.json "build" runs `prisma generate && next build`
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - "**/*"
      cache:
        paths:
          - node_modules/**/*
          - .next/cache/**/*
