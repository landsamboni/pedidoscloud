# AWS Amplify Hosting build settings (monorepo).
#
# AMPLIFY_MONOREPO_APP_ROOT=apps/web is set as an Amplify environment variable
# at the APP level (via Terraform). Amplify reads it during repo checkout —
# before branch-level vars are loaded — to locate package.json. All runtime
# vars (DATABASE_URL, S3, auth) are at the BRANCH level.
#
# Build notes:
# - prisma migrate deploy runs in preBuild so the schema is ready before
#   Next.js tries to prerender static pages (e.g. /admin). It is idempotent:
#   safe to run on every build, only unapplied migrations are executed.
#   This also means a `terraform destroy + apply` cycle requires no manual
#   migration step — the first build creates the schema automatically.
# - npm run build = prisma generate && next build (see package.json).
# - The node -e step writes runtime env vars to .next/.env.runtime (deployed
#   with the artifact) so lib/runtime-env.ts can load them in the SSR Lambda,
#   which does not receive Amplify branch-level env vars directly.
version: 1
applications:
  - appRoot: apps/web
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci
            - npx prisma migrate deploy
        build:
          commands:
            - npm run build
            - |
              node -e "
              const fs = require('fs');
              const vars = [
                'DATABASE_URL','STORAGE_DRIVER',
                'S3_REGION','S3_BUCKET','S3_ACCESS_KEY_ID','S3_SECRET_ACCESS_KEY',
                'ADMIN_USER','ADMIN_PASSWORD','RESTAURANT_USER','RESTAURANT_PASSWORD'
              ];
              const lines = vars.filter(k => process.env[k]).map(k => k + '=' + process.env[k]);
              fs.writeFileSync('.next/.env.runtime', lines.join('\n'));
              console.log('Runtime env written for:', vars.filter(k => process.env[k]).join(', '));
              "
      artifacts:
        baseDirectory: .next
        files:
          - "**/*"
      cache:
        paths:
          - node_modules/**/*
          - .next/cache/**/*
