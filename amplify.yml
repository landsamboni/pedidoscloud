# AWS Amplify Hosting build settings (monorepo).
#
# AMPLIFY_MONOREPO_APP_ROOT=apps/web is set as an Amplify environment variable
# (via Terraform). Both the env var and the applications.appRoot below are
# required together — one alone is not enough.
#
# Migrations are NOT run here — run `npm run db:deploy` against RDS manually
# (see DEPLOYMENT.md). Build only generates the Prisma client + next build.
version: 1
applications:
  - appRoot: apps/web
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - "**/*"
      cache:
        paths:
          - node_modules/**/*
          - .next/cache/**/*
